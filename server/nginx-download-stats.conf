# LiteSchedule 下载统计 - Nginx 配置片段
# 放到 schedule.hoshichan.moe 的 server block 里即可。

# 旧的直链自动跳到统计入口（按需保留）
location = /LiteSchedule-v1.0.2.apk {
    return 302 /dl/LiteSchedule-v1.0.2.apk;
}
location = /LiteSchedule-v1.0.1.apk {
    return 302 /dl/LiteSchedule-v1.0.1.apk;
}

# 下载统计服务
location /dl/ {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# 仅管理员查看（带 token）
location /stats {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
